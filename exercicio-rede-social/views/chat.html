{% extends 'base.html' %}
{% block content %}

<div class="container">
    <h1 class="text-center">Chat</h1>
    <hr>
    <div class="chat" id="chat">
        <!-- Aqui irão as mensagens-->
    </div>
    <hr>
    <input type="text" id="msg" class="form-control" placeholder="Digite sua mensagem...">
    <!-- Botão -->
    <button onclick="sendMsg()" class="btn btn-light btn-lg w-100 mt-2">
        Enviar
    </button>
</div>

<!-- Importação do Javascript do SocketIO -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>

<!-- Script de chat -->
<script>
    const nickname = {{ nickname | tojson }};
    const socket = io();
    const chat = document.getElementById("chat");

    // Adiciona uma linha no chat
    function addLinha(nome, texto) {
        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = nome;
        p.append(strong);
        p.append(document.createTextNode(texto));
        chat.append(p);
        chat.scrollTop = chat.scrollHeight;
    }

    socket.on("connect", () => {
        socket.emit("join", { nickname: nickname });
    });

    socket.on("join", data => {
        addLinha(data.nickname, " entrou no chat.");
    });

    socket.on("showmsg", data => {
        addLinha(data.nickname, ": " + data.msg);
    });

    function sendMsg() {
        const msgInput = document.getElementById("msg");
        const sentMsg = msgInput.value;
        if (!sentMsg.trim()) return;
        socket.emit("msg", { msg: sentMsg, nickname: nickname });
        msgInput.value = "";
    }

    document.getElementById("msg").addEventListener("keypress", function (e) {
        if (e.key === "Enter") sendMsg();
    });
</script>
{% endblock content %}
