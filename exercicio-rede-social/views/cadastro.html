{% extends 'base.html' %}
{% block content %}
<!-- PÁGINA DE CADASTRO -->
<div class="container">
    <div class="card mt-4">
        <div class="card-header">
            <h2>Cadastro de Usuário</h2>
        </div>
        <div class="card-body">
            <!-- FORMULÁRIO -->
            <form action="{{url_for('cadastro')}}" method="POST">
                <label>Nome / Nickname</label>
                <input type="text" name="nome" class="form-control" placeholder="Insira seu nome" required>
                <label class="mt-2">E-mail</label>
                <input type="email" name="email" class="form-control" placeholder="Insira seu e-mail" required>
                <label class="mt-2">Senha</label>
                <input type="password" name="senha" class="form-control" placeholder="Insira sua senha" required>
                <br>
                <!-- BOTÃO -->
                <button type="submit" class="btn btn-light">Cadastrar</button>
            </form>
            <hr>
            <h6>Já possui conta? <a href="{{url_for('login')}}">Entrar</a></h6>
        </div>
    </div>
</div>
{% endblock content %}
