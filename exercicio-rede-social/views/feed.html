{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h2 class="text-center">Feed</h2>
    <br>

    <!-- FORMULÁRIO DE POSTAGEM -->
    <div class="card mb-4">
        <div class="card-body">
            <form action="{{url_for('upload')}}" method="POST" enctype="multipart/form-data">
                <label>Envie sua imagem:</label>
                <input type="file" name="file" class="form-control" required>
                <label class="mt-2">Legenda:</label>
                <input type="text" name="legenda" class="form-control" placeholder="Escreva uma legenda...">
                <br>
                <button type="submit" class="btn btn-light">Publicar</button>
            </form>
        </div>
    </div>

    <!-- POSTS -->
    {% for post in posts %}
    <div class="card mb-4">
        <div class="card-header">
            <strong>{{ post.autor.nome }}</strong>
        </div>
        <img src="{{url_for('static', filename='uploads/' ~ post.imagem)}}" class="post-img" alt="Foto de {{ post.autor.nome }}">
        <div class="card-body">
            <p class="mb-1">{{ post.legenda or '' }}</p>
            <small class="post-info">{{ post.data_post.strftime('%d/%m/%Y às %H:%M') }}</small>
        </div>
    </div>
    {% else %}
    <p class="text-center post-info">Nenhuma publicação por aqui ainda.</p>
    {% endfor %}
</div>
{% endblock content %}
